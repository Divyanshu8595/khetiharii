name: Flutter quality checks

on:
  pull_request:
  push:
    branches: [master]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
